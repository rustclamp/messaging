[package]
name = "rustclamp-messaging"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "Versioned message envelope contracts for RustClamp applications."
repository = "https://github.com/rustclamp/messaging"
license = "MIT OR Apache-2.0"
readme = "README.md"
publish = false

[dependencies]
rustclamp-core = { version = "0.1.0", path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
