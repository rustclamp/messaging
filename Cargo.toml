[package]
name = "rustclamp-messaging"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "Versioned message envelope contracts for RustClamp applications."
repository = "https://github.com/rustclamp/messaging"
readme = "README.md"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
